o</text><text x="352" y="160" font-family="Georgia, 'Times New Roman', serif" font-size="26" fill="#8FD0FF" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0" opacity="1">3</text><text x="352" y="178" font-family="'Segoe UI', Helvetica, Arial, sans-serif" font-size="11.5" fill="#5A7189" font-weight="400" font-style="normal" text-anchor="start" letter-spacing="0" opacity="1">tables merged</text><rect x="522" y="156" width="56.0" height="24" rx="12" fill="none" stroke="#1B3A5C" stroke-width="1.2"/><text x="550.0" y="172" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#8FD0FF" font-weight="400" font-style="normal" text-anchor="middle" letter-spacing="0" opacity="1">Excel</text><rect x="586.0" y="156" width="56.0" height="24" rx="12" fill="none" stroke="#1B3A5C" stroke-width="1.2"/><text x="614.0" y="172" font-family="Consolas, 'SF Mono', Menlo, 'DejaVu Sans Mono', monospace" font-size="11.5" fill="#8FD0FF" font-weight="400" font-style="normal" text-anchor="middle" letter-spacing="0" opacity="1">Pivot</text><rect x="740" y="122" width="13" height="30" rx="3" fill="url(#bar)"/><rect x="760" y="106" width="13" height="46" rx="3" fill="url(#bar)"/><rect x="780" y="90" width="13" height="62" rx="3" fill="url(#bar)"/><rect x="800" y="112" width="13" height="40" rx="3" fill="url(#bar)"/><rect x="820" y="74" width="13" height="78" rx="3" fill="url(#bar)"/><rect x="840" y="98" width="13" height="54" rx="3" fill="url(#bar)"/><rect x="860" y="60" width="13" height="92" rx="3" fill="url(#bar)"/><line x1="734" y1="154" x2="886" y2="154" stroke="#1B3A5C"/></svg>